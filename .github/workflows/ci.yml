name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test

  tests:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cpython312
            python-version: "3.12"
            is_pypy: false
          - label: cpython313
            python-version: "3.13"
            is_pypy: false
          - label: cpython314
            python-version: "3.14"
            is_pypy: false
          - label: pypy311
            python-version: pypy-3.11-v7.3.20
            is_pypy: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check out pinned Kogwistar source
        if: matrix.is_pypy
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: v0.6.2
          path: kogwistar

      - name: Set PyPy import path
        if: matrix.is_pypy
        run: echo "PYTHONPATH=${{ github.workspace }}/kogwistar" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPython package and test dependencies
        if: matrix.is_pypy == false
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pytest>=8"

      - name: Install PyPy Python-authority dependencies
        if: matrix.is_pypy
        env:
          KOGWISTAR_IMPL_MODE: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kogwistar/requirements-pypy-3.11-experimental.txt
          python -m pip install --no-deps -e "."

      - name: Run tests
        env:
          KOGWISTAR_IMPL_MODE: python
        run: python -m pytest -q -p no:cacheprovider

  parity:
    name: Rust Python Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install --upgrade pytest
      - name: Test Rust
        working-directory: rust
        run: cargo test
      - name: Test cross-language parity
        run: python -m pytest tests/test_cross_language_parity.py -q -p no:cacheprovider
