[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-obsidian-sink"
version = "0.2.0"
description = "Composable Obsidian vault sink for Kogwistar projections"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PChan"}]
dependencies = [
    "kogwistar @ git+https://github.com/humblemat810/kogwistar.git@ae24e1663a66deb0e65d6e2bf74a2e5ef317e1ea ; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kogwistar-obsidian-sink = "kogwistar_obsidian_sink.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["kogwistar_obsidian_sink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
